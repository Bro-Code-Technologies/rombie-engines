<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Netplay engine check</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 16px; background: #14141a; color: #e6e6ee; }
  fieldset { border: 1px solid #333; border-radius: 6px; margin: 0 0 12px; }
  label { margin-right: 14px; }
  input[type=number] { width: 80px; }
  button { margin: 4px 6px 4px 0; }
  #screens { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  figure { margin: 0; }
  figcaption { color: #9a9aaa; }
  canvas { width: 512px; height: 480px; max-width: 100%; height: auto; background: #000; image-rendering: pixelated; }
  #log { font-family: ui-monospace, monospace; white-space: pre-wrap; background: #0d0d12; padding: 10px; border-radius: 6px; }
  .ok { color: #6ee7a8; } .bad { color: #ff8080; }
</style>
</head>
<body>
<!--
  Checks Rombie's netplay engine on its own, outside Rombie:
  - Determinism: engine A runs a scripted game straight; engine B runs the same inputs the way
    a rollback session does for a guest (player 1's input, the host's, arrives late, B guesses,
    then rolls back and runs again). Each frame's game memory and picture must match. The whole saved state is
    compared too: it also holds frontend-side parts a core may not restore exactly on load
    (fceumm's sound filter), so it can differ while the game itself does not.
  - Timings: save, load and one frame, measured inside the engine.
  - Stress: every frame, roll back 8 frames and run them again plus the new one, at 60 fps,
    with the page's message round trips counted.
  - Solo state: loads a core state taken from a RetroArch save (the engine is given the core's
    own state; unwrapping RetroArch's file is the caller's job), then plays on.
  Serve this folder over HTTP after building (a Worker will not start from file://), for
  example `python -m http.server 8642` in netplay/, and open http://localhost:8642/test.html.
  ?engine=out/supafaust.js or ?engine=out/pcsx_rearmed.js picks another engine. For a disc game,
  pick all of its files at once (a .cue and its .bin files, or one .chd); the .cue is loaded.
  A BIOS goes into the core's system folder under the name it is picked with.
-->
<h1>Netplay engine check</h1>
<fieldset>
  <label>ROM or disc files <input type="file" id="rom" multiple></label>
  <label>BIOS (PS1) <input type="file" id="bios"></label>
  <label>Core state for the solo check <input type="file" id="state"></label>
</fieldset>
<fieldset>
  <label>Frames <input type="number" id="frames" value="36000"></label>
  <label><input type="checkbox" id="realtime"> real time (60 fps)</label>
  <label><input type="checkbox" id="control"> control: B gets inputs A never sees (must fail)</label>
  <label>Stress seconds <input type="number" id="stressSeconds" value="30"></label>
  <label>Rollback frames <input type="number" id="rollback" value="8"></label>
</fieldset>
<button id="runAll">Run all</button>
<button id="runDeterminism">Determinism</button>
<button id="runTimings">Timings</button>
<button id="runStress">Stress</button>
<button id="runSolo">Solo state</button>
<div id="screens">
  <figure><canvas id="canvasA" width="256" height="240"></canvas><figcaption>A</figcaption></figure>
  <figure><canvas id="canvasB" width="256" height="240"></canvas><figcaption>B (rolls back)</figcaption></figure>
</div>
<div id="log"></div>
<script type="module">
const ENGINE_URL = new URLSearchParams(location.search).get('engine') || 'out/fceumm.js'
const PORTS = 4
const VALUES_PER_FRAME = PORTS * 5
const FRAME_MS = 1000 / 60
const JOYPAD = { B: 0, Y: 1, SELECT: 2, START: 3, UP: 4, DOWN: 5, LEFT: 6, RIGHT: 7, A: 8, X: 9 }

const $ = (id) => document.getElementById(id)
const logEl = $('log')
function log(message, cls) {
  const line = document.createElement('div')
  if (cls) line.className = cls
  line.textContent = message
  logEl.appendChild(line)
  console.log(message)
}
const results = (globalThis.netplaySpike = { running: false })

class Engine {
  constructor() {
    this.worker = new Worker(ENGINE_URL)
    this.nextId = 1
    this.pending = new Map()
    this.worker.onmessage = ({ data }) => {
      const waiter = this.pending.get(data.id)
      if (!waiter) return
      this.pending.delete(data.id)
      if (data.type === 'error') waiter.reject(new Error(`${data.request}: ${data.message}`))
      else waiter.resolve(data)
    }
    this.worker.onerror = (e) => log(`worker error: ${e.message}`, 'bad')
  }
  request(msg, transfer = []) {
    const id = this.nextId++
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject })
      this.worker.postMessage({ ...msg, id }, transfer)
    })
  }
  close() { this.worker.terminate() }
}

const DISC = /\.(cue|bin|img|iso|chd|pbp)$/i

async function readRom() {
  const picked = [...$('rom').files]
  if (!picked.length) throw new Error('pick a ROM first')
  const bios = $('bios').files[0]
  const system = bios ? [{ name: bios.name, data: await bios.arrayBuffer() }] : []
  // A disc is mounted from its files in the engine's Worker, never read here.
  const disc = picked.length > 1 || DISC.test(picked[0].name)
  const main = picked.find((file) => /\.cue$/i.test(file.name)) || picked[0]
  return {
    name: main.name,
    size: picked.reduce((sum, file) => sum + file.size, 0),
    system,
    ...(disc ? { files: picked.map((file) => ({ name: file.name, data: file })) } : { bytes: await main.arrayBuffer() }),
  }
}

async function startEngine(rom) {
  const engine = new Engine()
  const system = rom.system.map((file) => ({ name: file.name, data: file.data.slice(0) }))
  const game = rom.files ? { files: rom.files } : { rom: rom.bytes.slice(0) }
  const info = await engine.request({ type: 'load', name: rom.name, system, ...game })
  return { engine, info }
}

function draw(canvas, video) {
  if (!video) return
  if (canvas.width !== video.width || canvas.height !== video.height) {
    canvas.width = video.width
    canvas.height = video.height
  }
  const image = new ImageData(new Uint8ClampedArray(video.pixels), video.width, video.height)
  canvas.getContext('2d').putImageData(image, 0, 0)
}

// A deterministic stand-in for two players: buttons held for a few frames at a time, leaning
// on Right, A and B so the game is played rather than left in a menu, and Start twice every ten
// seconds (past title screens; in play, a pause and unpause).
function scriptedInputs(frames, seed) {
  let s = seed >>> 0
  const random = () => {
    s = (s + 0x6d2b79f5) >>> 0
    let t = s
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
  const pool = [[JOYPAD.RIGHT, 0.5], [JOYPAD.LEFT, 0.12], [JOYPAD.UP, 0.12], [JOYPAD.DOWN, 0.12], [JOYPAD.A, 0.4], [JOYPAD.B, 0.4]]
  const values = new Int16Array(frames * VALUES_PER_FRAME)
  for (let port = 0; port < 2; port++) {
    let held = 0
    let left = 0
    for (let f = 0; f < frames; f++) {
      if (left-- <= 0) {
        held = 0
        for (const [bit, odds] of pool) if (random() < odds) held |= 1 << bit
        if (random() < 0.01) held |= 1 << JOYPAD.SELECT
        left = 4 + Math.floor(random() * 16)
      }
      let buttons = held
      if ((f % 600 < 6 || (f % 600 >= 30 && f % 600 < 36)) && port === 0) buttons |= 1 << JOYPAD.START
      values[f * VALUES_PER_FRAME + port * 5] = buttons
    }
  }
  return values
}

function framesSlice(values, from, to) {
  return values.slice(from * VALUES_PER_FRAME, to * VALUES_PER_FRAME)
}

// Names the parts of two saved states that differ, by the nearest field tag before each differing
// byte (fceumm and Mednafen-based cores tag their fields with four characters, such as "FAC1").
function differingParts(x, y) {
  const parts = new Set()
  const isTag = (i) => {
    let letters = 0
    for (let k = 0; k < 4; k++) {
      const c = x[i + k]
      const upper = c >= 65 && c <= 90
      if (!(upper || (c >= 48 && c <= 57) || (k > 1 && c === 0))) return false
      if (upper) letters++
    }
    return letters >= 2
  }
  for (let i = 0; i < x.length && parts.size < 12; i++) {
    if (x[i] === y[i]) continue
    let j = i - 4
    while (j >= 0 && i - j < 4096 && !isTag(j)) j--
    parts.add(j >= 0 && i - j < 4096 ? String.fromCharCode(...x.subarray(j, j + 4)).replace(/\0/g, '') : `byte ${i}`)
  }
  return [...parts]
}

const sleepUntil = (t) => new Promise((r) => setTimeout(r, Math.max(0, t - performance.now())))

async function runDeterminism(rom) {
  const frames = Number($('frames').value)
  const realtime = $('realtime').checked
  const truth = scriptedInputs(frames, 22)
  // The control proves the comparison can fail: from halfway, B's copy of player 1's input is a
  // different player's, as if corrections were lost.
  const control = $('control').checked
  const truthB = truth.slice()
  if (control) {
    const other = scriptedInputs(frames, 23)
    for (let f = frames >> 1; f < frames; f++) truthB[f * VALUES_PER_FRAME] = other[f * VALUES_PER_FRAME]
  }
  const [a, b] = await Promise.all([startEngine(rom), startEngine(rom)])
  log(`determinism: ${frames} frames (${(frames / 60 / 60).toFixed(1)} min of play), ${realtime ? 'real time' : 'as fast as the engines go'}; ${a.info.library}, state ${a.info.stateSize} bytes`)

  const hashA = new Uint32Array(frames)
  const hashB = new Uint32Array(frames)
  const memA = new Uint32Array(frames)
  const memB = new Uint32Array(frames)
  const picA = new Uint32Array(frames)
  const picB = new Uint32Array(frames)
  const keepB = (reply, from) => reply.hashes.forEach((h, i) => {
    hashB[from + i] = h
    memB[from + i] = reply.memoryHashes[i]
    picB[from + i] = reply.videoHashes[i]
  })
  // What B has run with: player 1's input is only known `delay` frames late, so until then B
  // repeats the last one it knows, as a rollback session predicts.
  const usedB = new Int16Array(frames * VALUES_PER_FRAME)
  let confirmed = -1
  let rollbacks = 0
  let rerun = 0
  let seed = 7
  const delay = () => ((seed = (seed * 1103515245 + 12345) >>> 0) >>> 16) % 8

  function inputForB(f) {
    const known = Math.min(f, confirmed)
    const out = truthB.slice(f * VALUES_PER_FRAME, (f + 1) * VALUES_PER_FRAME)
    const remote = known >= 0 ? truthB.subarray(known * VALUES_PER_FRAME, known * VALUES_PER_FRAME + 5) : new Int16Array(5)
    out.set(remote, 0)
    return out
  }
  function differs(f) {
    for (let i = 0; i < 5; i++) if (usedB[f * VALUES_PER_FRAME + i] !== truthB[f * VALUES_PER_FRAME + i]) return true
    return false
  }

  async function stepB(f, draw) {
    const reach = f - delay()
    let from = f
    if (reach > confirmed) {
      for (let g = confirmed + 1; g <= Math.min(reach, f - 1); g++) {
        if (differs(g)) { from = g; break }
      }
      confirmed = reach
    }
    if (from < f) { rollbacks++; rerun += f - from }
    const count = f + 1 - from
    const inputs = new Int16Array(count * VALUES_PER_FRAME)
    for (let i = 0; i < count; i++) {
      const frame = inputForB(from + i)
      usedB.set(frame, (from + i) * VALUES_PER_FRAME)
      inputs.set(frame, i * VALUES_PER_FRAME)
    }
    const reply = await b.engine.request({ type: 'run', from, inputs: inputs.buffer, audioFrom: f, video: draw, hashes: true }, [inputs.buffer])
    keepB(reply, from)
    return reply
  }

  const started = performance.now()
  let next = started
  for (let f = 0; f < frames; f++) {
    const show = realtime || f % 30 === 0 || f === frames - 1
    const inputsA = framesSlice(truth, f, f + 1)
    const [ra, rb] = await Promise.all([
      a.engine.request({ type: 'run', from: f, inputs: inputsA.buffer, video: show, hashes: true }, [inputsA.buffer]),
      stepB(f, show),
    ])
    hashA[f] = ra.hashes[0]
    memA[f] = ra.memoryHashes[0]
    picA[f] = ra.videoHashes[0]
    if (show) { draw($('canvasA'), ra.video); draw($('canvasB'), rb.video) }
    if (f % 3600 === 0 && f) log(`  ${f / 3600} min of play run`)
    if (realtime) await sleepUntil((next += FRAME_MS))
  }
  // The last few frames of player 1's input arrive, and B corrects them, as it would once play
  // stops.
  const last = frames
  let from = last
  for (let g = confirmed + 1; g < last; g++) if (differs(g)) { from = g; break }
  if (from < last) {
    rollbacks++
    rerun += last - from
    const inputs = framesSlice(truthB, from, last)
    const reply = await b.engine.request({ type: 'run', from, inputs: inputs.buffer, video: false, hashes: true }, [inputs.buffer])
    keepB(reply, from)
  }
  const [stateA, stateB] = await Promise.all([a.engine.request({ type: 'save' }), b.engine.request({ type: 'save' })])
  const finalA = new Uint8Array(stateA.data)
  const finalB = new Uint8Array(stateB.data)
  const finalSame = finalA.length === finalB.length && finalA.every((v, i) => v === finalB[i])
  const stateParts = finalSame ? [] : differingParts(finalA, finalB)

  const compare = (x, y) => {
    let count = 0
    let first = -1
    for (let f = 0; f < frames; f++) {
      if (x[f] !== y[f]) {
        count++
        if (first < 0) first = f
      }
    }
    return { count, first }
  }
  const memory = compare(memA, memB)
  const picture = compare(picA, picB)
  const state = compare(hashA, hashB)
  const seconds = (performance.now() - started) / 1000
  const ok = control ? memory.count > 0 && picture.count > 0 : memory.count === 0 && picture.count === 0
  const said = (c) => `${c.count}${c.first >= 0 ? ` (first at frame ${c.first})` : ''}`
  log(`determinism${control ? ' CONTROL (expected to fail)' : ''}: mismatches in ${frames} frames: game memory ${said(memory)}, picture ${said(picture)}; whole saved state ${said(state)}, final states ${finalSame ? 'identical' : `different in ${stateParts.join(', ')}`}; B rolled back ${rollbacks} times and ran ${rerun} frames again; ${seconds.toFixed(1)} s`, ok ? 'ok' : 'bad')
  a.engine.close()
  b.engine.close()
  return { control, frames, memory, picture, state, finalSame, stateParts, rollbacks, rerun, seconds, stateSize: a.info.stateSize, library: a.info.library }
}

async function runTimings(rom) {
  const { engine, info } = await startEngine(rom)
  // Into the game first, so the frame being timed is a busy one.
  const warm = scriptedInputs(1200, 3)
  await engine.request({ type: 'run', from: 0, inputs: warm.buffer, video: false }, [warm.buffer])
  const bench = await engine.request({ type: 'bench', iterations: 1000 })
  engine.close()
  const fmt = (ms) => `${(ms * 1000).toFixed(0)} us`
  log(`timings (inside the engine, 1000 each): save ${fmt(bench.serializeMs)}, load ${fmt(bench.unserializeMs)}, frame ${fmt(bench.frameMs)}; state ${bench.stateSize} bytes`, 'ok')
  return { library: info.library, ...bench }
}

async function runStress(rom) {
  const seconds = Number($('stressSeconds').value)
  const window = Number($('rollback').value)
  const ticks = Math.round(seconds * 60)
  const truth = scriptedInputs(ticks + window + 1, 11)
  const { engine } = await startEngine(rom)
  const first = framesSlice(truth, 0, window)
  await engine.request({ type: 'run', from: 0, inputs: first.buffer, video: false }, [first.buffer])

  const roundTrips = []
  const engineMs = []
  let late = 0
  const started = performance.now()
  let next = started
  for (let t = 0; t < ticks; t++) {
    const f = window + t
    const inputs = framesSlice(truth, f - window, f + 1)
    const sent = performance.now()
    const reply = await engine.request({ type: 'run', from: f - window, inputs: inputs.buffer, audioFrom: f, video: true }, [inputs.buffer])
    const roundTrip = performance.now() - sent
    draw($('canvasA'), reply.video)
    roundTrips.push(roundTrip)
    engineMs.push(reply.engineMs)
    if (roundTrip > FRAME_MS) late++
    next += FRAME_MS
    if (performance.now() > next) next = performance.now()
    await sleepUntil(next)
  }
  const elapsed = (performance.now() - started) / 1000
  engine.close()
  const sorted = [...roundTrips].sort((x, y) => x - y)
  const mean = (xs) => xs.reduce((s, x) => s + x, 0) / xs.length
  const out = {
    window,
    ticks,
    fps: ticks / elapsed,
    roundTripMeanMs: mean(roundTrips),
    roundTripP95Ms: sorted[Math.floor(sorted.length * 0.95)],
    roundTripMaxMs: sorted[sorted.length - 1],
    engineMeanMs: mean(engineMs),
    lateTicks: late,
  }
  out.budgetShare = out.roundTripMeanMs / FRAME_MS
  log(`stress: ${window} frames rolled back and run again plus 1 new, every frame for ${seconds} s: ${out.fps.toFixed(1)} fps held; round trip mean ${out.roundTripMeanMs.toFixed(2)} ms (${(out.budgetShare * 100).toFixed(0)}% of the 16.7 ms frame), p95 ${out.roundTripP95Ms.toFixed(2)} ms, max ${out.roundTripMaxMs.toFixed(2)} ms; inside the engine ${out.engineMeanMs.toFixed(2)} ms; ${late} ticks over budget`, out.fps > 59 && out.roundTripP95Ms < FRAME_MS ? 'ok' : 'bad')
  return out
}

async function runSolo(rom) {
  const file = $('state').files[0]
  if (!file) {
    log('solo state: skipped (no core state picked)')
    return { skipped: true }
  }
  const state = await file.arrayBuffer()
  const { engine, info } = await startEngine(rom)
  const loaded = await engine.request({ type: 'loadState', data: state, frame: 0 }, [state]).then(() => true, (err) => {
    log(`solo state: ${err.message}`, 'bad')
    return false
  })
  if (!loaded) { engine.close(); return { loaded: false, stateBytes: file.size, engineStateSize: info.stateSize } }
  const pixelsHash = (video) => {
    let h = 2166136261
    const words = new Uint32Array(video.pixels)
    for (let i = 0; i < words.length; i++) h = Math.imul(h ^ words[i], 16777619)
    return h >>> 0
  }
  const lit = (video) => new Uint32Array(video.pixels).some((p) => (p & 0xffffff) !== 0)
  const idle = new Int16Array(VALUES_PER_FRAME)
  const first = await engine.request({ type: 'run', from: 0, inputs: idle.slice().buffer, video: true })
  draw($('canvasB'), first.video)
  const walk = scriptedInputs(300, 5)
  const later = await engine.request({ type: 'run', from: 1, inputs: walk.buffer, video: true }, [walk.buffer])
  draw($('canvasA'), later.video)
  engine.close()
  const out = {
    loaded: true,
    stateBytes: file.size,
    firstFrameLit: lit(first.video),
    playsOn: pixelsHash(first.video) !== pixelsHash(later.video),
    firstFramePng: $('canvasB').toDataURL('image/png'),
  }
  log(`solo state: loaded ${file.size} bytes; first frame ${out.firstFrameLit ? 'drawn' : 'BLACK'}; after 300 more frames the picture ${out.playsOn ? 'has moved on' : 'DID NOT CHANGE'}`, out.firstFrameLit && out.playsOn ? 'ok' : 'bad')
  return out
}

async function run(which) {
  if (results.running) return
  results.running = true
  results.error = null
  try {
    const rom = await readRom()
    log(`rom ${rom.name} (${rom.size} bytes${rom.files ? `, ${rom.files.length} files mounted` : ''}${rom.system.length ? `, BIOS ${rom.system[0].name}` : ''}), engine ${ENGINE_URL}`)
    if (which === 'all' || which === 'timings') results.timings = await runTimings(rom)
    if (which === 'all' || which === 'solo') results.solo = await runSolo(rom)
    if (which === 'all' || which === 'stress') results.stress = await runStress(rom)
    if (which === 'all' || which === 'determinism') results.determinism = await runDeterminism(rom)
  } catch (err) {
    results.error = err.message
    log(`FAILED: ${err.message}`, 'bad')
  } finally {
    results.running = false
    results.finished = (results.finished || 0) + 1
  }
}

$('runAll').onclick = () => run('all')
$('runDeterminism').onclick = () => run('determinism')
$('runTimings').onclick = () => run('timings')
$('runStress').onclick = () => run('stress')
$('runSolo').onclick = () => run('solo')
globalThis.netplaySpikeRun = run
</script>
</body>
</html>
